name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  ELIXIR_VERSION: "1.19.1"
  OTP_VERSION: "28.1.1"
  DOCKER_IMAGE: verastack/plugboard

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOCKER_ENABLED: ${{ secrets.DOCKER_USERNAME != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Plugboard ${{ steps.version.outputs.version }}

            ### Installation

            **Docker:**
            ```bash
            docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
            ```

            Or use the latest tag:
            ```bash
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            ```

            ### Running
            ```bash
            docker run -p 4000:4000 ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.DOCKER_ENABLED == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: env.DOCKER_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
            OTP_VERSION=${{ env.OTP_VERSION }}
            MAX_REQUEST_BODY_SIZE=10485760
            MOUNT_STORE_RECONCILE_INTERVAL=30000
            TELEPHONE_TOKEN_EXPIRY=3600
            TELEPHONE_TOKEN_REFRESH_INTERVAL=1800
