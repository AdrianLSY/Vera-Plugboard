services:
  postgres:
    image: postgres:18.1-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  plugboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE}
        MOUNT_STORE_RECONCILE_INTERVAL: ${MOUNT_STORE_RECONCILE_INTERVAL}
        TELEPHONE_TOKEN_EXPIRY: ${TELEPHONE_TOKEN_EXPIRY}
        TELEPHONE_TOKEN_REFRESH_INTERVAL: ${TELEPHONE_TOKEN_REFRESH_INTERVAL}
    environment:
      # Phoenix Server Configuration
      PHX_SERVER: ${PHX_SERVER}
      PHX_PORT: ${PHX_PORT}
      PHX_HOST: ${PHX_HOST}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}

      # PostgreSQL Database
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT}
      ECTO_IPV6: ${ECTO_IPV6}

      # Application Settings
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE}
      MOUNT_STORE_RECONCILE_INTERVAL: ${MOUNT_STORE_RECONCILE_INTERVAL}

      # Telephone Token Configuration
      TELEPHONE_TOKEN_EXPIRY: ${TELEPHONE_TOKEN_EXPIRY}
      TELEPHONE_TOKEN_REFRESH_INTERVAL: ${TELEPHONE_TOKEN_REFRESH_INTERVAL}

      # Production Clustering
      DNS_CLUSTER_QUERY: ${DNS_CLUSTER_QUERY}
    ports:
      - "${PHX_PORT}:${PHX_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
